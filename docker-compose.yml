services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb_atlas_restaurant
    hostname: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
    networks:
      - restaurant-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack_restaurant
    environment:
      - SERVICES=s3
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./docker/localstack/seed-assets.sh:/etc/localstack/init/ready.d/10-seed-assets.sh:ro
      - ./frontend/public/assets/menu:/opt/ragtaurant-assets:ro
    networks:
      - restaurant-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-object --bucket ragtaurant-assets --key menu/hero.jpg >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - MENU_ADMIN_TOKEN=${MENU_ADMIN_TOKEN:-}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-3.5-flash-lite}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-768}
      - MONGODB_URI=mongodb://mongodb:27017/?directConnection=true
      - DB_NAME=rag-taurant
      - VECTOR_SEARCH_MODE=${VECTOR_SEARCH_MODE:-atlas}
      - S3_ENDPOINT_URL=http://localstack:4566
      - S3_BUCKET=ragtaurant-assets
      - S3_ACCESS_KEY_ID=test
      - S3_SECRET_ACCESS_KEY=test
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - restaurant-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "80:8080"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started
    networks:
      - restaurant-net
    restart: unless-stopped

networks:
  restaurant-net:
    driver: bridge

volumes:
  mongodb_data:
  configdb:
  mongot:
