services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_restaurant
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - restaurant-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: mongodb_atlas_restaurant
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - configdb:/data/configdb
      - mongot:/data/mongot
    networks:
      - restaurant-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.4.0
    container_name: localstack_restaurant
    environment:
      - SERVICES=s3
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./docker/localstack/seed-assets.sh:/etc/localstack/init/ready.d/10-seed-assets.sh:ro
      - ./frontend/public/assets/menu:/opt/ragtaurant-assets:ro
    networks:
      - restaurant-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-object --bucket ragtaurant-assets --key menu/hero.jpg >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3:8b
      - EMBEDDING_MODEL=bge-m3
      - EMBEDDING_DIMENSIONS=1024
      - MONGODB_URI=mongodb://mongodb:27017/?directConnection=true
      - DB_NAME=rag-taurant
    depends_on:
      ollama:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - restaurant-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:
      - restaurant-net
    restart: unless-stopped

networks:
  restaurant-net:
    driver: bridge

volumes:
  ollama_storage:
  mongodb_data:
  configdb:
  mongot:
